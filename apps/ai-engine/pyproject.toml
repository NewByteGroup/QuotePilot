[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quotepilot-ai-engine"
version = "0.1.0"
description = "QuotePilot ai-engine: stateless LLM agents and carrier connectors"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1.0",
    "pydantic>=2.11.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "mypy==1.19.1",
]

[tool.hatch.build.targets.wheel]
packages = ["connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
