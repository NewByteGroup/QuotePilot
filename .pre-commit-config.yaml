# Local parity with the CI `lint` and `security` jobs (AGENTS.md, CI/CD).
# Install once per clone: `pip install pre-commit && pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # ruff check + ruff format — same tools as the `lint` job. Hooks download and
  # pin their own ruff build matching rev.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
      - id: ruff-format

  # Secret scan — same as the `security` job. The repo is public.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # gofmt — needs a local Go toolchain; only meaningful once .go files exist
  # (the hook simply never matches a file before then).
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w -l
        language: system
        types: [go]
