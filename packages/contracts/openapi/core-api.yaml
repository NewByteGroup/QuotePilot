# OpenAPI 3.0.3 contract for the apps/core-api request edge — 3.0.3, not 3.1,
# because oapi-codegen does not support 3.1 (ADR-002 section 1).
#
# This file fixes the wire shapes implied by
# docs/specs/2026-11-10-tenant-resolution-api.md (sections 4, 7 and 8) and
# ADR-005; the C1–C6 PRs implement handlers against the strict-server
# interfaces generated from it. It also carries payload-only schemas (no
# paths) for third-party webhooks — today the Resend `email.received`
# envelope, decoded by the hand-mounted handler in internal/inbox, which must
# stay out of the strict-server interface because Svix signature
# verification runs on the raw body before any binding. Generated output is
# committed to apps/core-api/internal/auth/authapi and the CI
# contracts-drift job fails on any regeneration diff — never hand-edit
# generated code.
openapi: "3.0.3"

info:
  title: QuotePilot core-api
  version: 0.1.0
  description: |
    Request edge of `apps/core-api`: magic-link login, cookie sessions and the
    first tenant-resolution proof endpoint.

    Authentication travels in two HttpOnly cookies (`qp_access` and
    `qp_refresh` — see `components.securitySchemes`), never in an
    `Authorization` header; tenant context travels in the `X-Organization-Id`
    header. Failures are uniform (spec section 1): every authentication error
    is the same 401 body, and a non-member and a nonexistent organization get
    a byte-identical 404. Nothing in a response reveals whether an email, an
    organization or a token exists.

    Cookies are documented through the security schemes and operation
    descriptions, not response `headers`: `Set-Cookie` carries comma-bearing
    `Expires` dates, so a single header entry cannot represent the pair each
    endpoint sets. Handlers write both cookies explicitly.
  contact:
    url: https://github.com/NewByteGroup/QuotePilot
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

# No public host is decided yet (ADR-007 environments are open); the routes
# below are root-mounted, so the contract pins a relative server only.
servers:
  - url: /

tags:
  - name: auth
    description: |
      Magic-link session lifecycle (spec section 8): `/auth/login` sends the
      link, `/auth/session` exchanges it for the cookie pair, `/auth/refresh`
      rotates it and `/auth/logout` revokes it.
  - name: me
    description: |
      Caller identity and the end-to-end tenant-resolution proof — request →
      JWT → membership → `InTenantTx` (spec section 8).
  - name: quotes
    description: |
      Quote lifecycle endpoints of the staged pipeline (spec
      2026-11-11-staged-quote-pipeline section 4).
  - name: rfqs
    description: |
      RFQ lifecycle endpoints of the staged pipeline (spec
      2026-11-11-staged-quote-pipeline section 4 "Reprocess").
  - name: web
    description: |
      The web v1 read surface (web-api.yaml folded in per its header
      comment): session bootstrap, org switching and the inbox/quote-audit
      reads apps/web swaps its MSW mock for. Field names and wire shapes
      are the mock contract's verbatim — Amanda's client changes nothing.

paths:
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Log in — request a magic link, or authenticate with email + password.
      description: |
        Two paths keyed on the request body (ADR-005 amendment 2026-11-16 —
        the pilot meeting made user + password the MVP login, with the
        magic-link pipeline retained as the reset mechanism and a fallback):

        - `password` ABSENT — the magic-link path: if `email` belongs to a
          provisioned user, the server stores a `create_login_token` hash and
          sends `${WEB_URL}/auth/exchange?token=…` through the platform
          sender; otherwise it does nothing. The 200 `{"status":"ok"}` body is
          identical either way — the endpoint cannot enumerate users (spec
          section 8). The link opens a page and the state change is this POST,
          so mail scanners prefetching it consume nothing.
        - `password` PRESENT — even as the empty string — the password path:
          the password is verified against the argon2id hash
          `get_user_auth_by_email` returns. Success answers exactly like
          `POST /auth/session`: the `qp_access`/`qp_refresh` cookie pair plus
          the profile and memberships the organization switcher renders.
          Failure is the single uniform 401 `{"error":"unauthenticated"}` —
          an unknown email, an unset password (NULL hash) and a wrong
          password are indistinguishable on the wire.

        Rate limited per email and per IP on both paths (spec section 8.1:
        proposed 5 tokens/email/hour and 30 requests/IP/hour); every password
        attempt spends both buckets.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            Magic-link path: `{"status":"ok"}` for any well-formed email —
            existing user or not. Password path: session created — the
            `qp_access`/`qp_refresh` cookie pair is set as described in the
            operation description and the body carries the switcher payload.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password-reset:
    post:
      operationId: postAuthPasswordReset
      tags: [auth]
      summary: Request a password-reset link — never enumerates.
      description: |
        The amendment's "forgot password" request (ADR-005 amendment
        2026-11-16 — the magic-link pipeline is retained as the reset
        mechanism): if `email` belongs to a provisioned user the server
        stages a `purpose='password_reset'` token and queues
        `${WEB_URL}/auth/set-password?token=…` through the same
        outbox + token machinery as the magic link — same hash-at-rest,
        single use, short expiry; otherwise it does nothing. The 200
        `{"status":"ok"}` body is identical either way — the endpoint
        cannot enumerate users (spec section 8). The link lands on a
        set-password page and never starts a session, and a reset token
        is not a magic-link token: `POST /auth/session` will not consume
        it — the two token classes are not interchangeable in either
        direction. Rate limited like `/auth/login`: per email and per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: |
            `{"status":"ok"}` for any well-formed email — existing user or
            not. Identical to the magic-link request's uniform answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password:
    post:
      operationId: postAuthPassword
      tags: [auth]
      summary: Set a new password from a reset token — answers no session.
      description: |
        The set-password side of "forgot password" (ADR-005 amendment
        2026-11-16): consumes a `purpose='password_reset'` token
        (`consume_password_reset_token` — the same single-use row-lock
        consume as the magic-link token), stores the argon2id hash
        (`set_user_password`) and revokes every live session of the user
        (`revoke_user_sessions` — OWASP: a credential reset invalidates
        existing sessions), all in one transaction. Success is
        `{"status":"ok"}` only: the set-password page does not start a
        session, the user logs in through `/auth/login`'s password path
        next. A used, expired or unknown token — including a LOGIN token
        presented here — gets the single uniform 401, byte-identical to
        `/auth/session`'s. Rate limited per IP (no email key exists on
        this route).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetRequest'
      responses:
        '200':
          description: |
            Password updated and existing sessions revoked. No cookie is
            set and no session is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/session:
    post:
      operationId: postAuthSession
      tags: [auth]
      summary: Exchange a magic-link token for the session cookie pair.
      description: |
        Consumes a single-use login token (`consume_login_token`): on success
        creates the session family (`create_session`), signs the access JWT
        and sets both cookies — `qp_access` (HttpOnly, Secure, SameSite=Lax,
        `Path=/`, 15 minutes) and `qp_refresh` (HttpOnly, Secure,
        SameSite=Strict, `Path=/auth`, 30 days sliding) — then returns
        the profile and memberships the organization switcher renders (spec
        sections 3.3 and 8). A used, expired or unknown token gets the same
        401 body; nothing distinguishes the cases.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: |
            Session created — the `qp_access`/`qp_refresh` cookie pair is set
            as described in the operation description. Body carries the
            switcher payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [auth]
      summary: Rotate the refresh cookie and mint a new access cookie.
      description: |
        Exchanges the `qp_refresh` cookie for the next generation in the same
        session family (`rotate_session`, spec section 4). Success sets a
        fresh `qp_access` cookie and a rotated `qp_refresh` scoped `Path=/auth`
        — it must also reach `/auth/logout`. Presenting an already-rotated or
        already-revoked token is reuse:
        the whole family is revoked in the same atomic call, both cookies are
        cleared, and the uniform 401 is returned. Unknown or expired tokens
        clear the cookies and get the same 401.
      security:
        - qpRefresh: []
      responses:
        '200':
          description: |
            Rotated — a new `qp_access` cookie and the rotated `qp_refresh`
            cookie are set (see operation description). No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Revoke the session family and clear both cookies.
      description: |
        Reads `qp_refresh` — still valid after `qp_access` expires — and
        revokes the family (`revoke_session_family_by_hash`). Always 204 with both cookies
        cleared, valid token or not: the response carries no validity oracle
        (spec section 8). The access JWT keeps verifying until its `exp`
        (≤15 min) — the accepted revocation lag of spec section 4.
      # Cookie optional: logout must answer 204 even when the cookie is
      # absent or already dead — a mandatory scheme would let generated
      # clients refuse to send the call at all.
      security:
        - {}
        - qpRefresh: []
      responses:
        '204':
          description: |
            Always; `qp_access` and `qp_refresh` are cleared regardless of
            whether the presented token was valid.
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: The caller's profile and memberships.
      description: |
        `Authenticate` verifies the `qp_access` JWT (signature, `exp`, known
        `kid` — spec section 7; no database call), then the handler returns
        `get_user_profile(sub)` plus the extended `list_memberships_for_email`
        set — the organization switcher payload. Role and organization are
        never in the JWT; membership is re-checked on every request.
      security:
        - qpAccess: []
      responses:
        '200':
          description: Profile plus the membership list for the switcher.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/organization:
    get:
      operationId: getMeOrganization
      tags: [me]
      summary: Resolve the requested organization — the end-to-end tenant proof.
      description: |
        `Authenticate` then `ResolveTenant` (spec section 7): an absent or
        non-UUID `X-Organization-Id` is a 400; a non-member and a nonexistent
        organization get the same byte-identical 404 (`get_membership`
        returns NULL for both — the indistinguishability is the security
        property). On membership the handler calls
        `get_current_organization()` inside `InTenantTx` — the first endpoint
        where request → JWT → tenant transaction runs for real (spec
        section 8).
      security:
        - qpAccess: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: The resolved organization, read inside `InTenantTx`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: |
            `X-Organization-Id` absent or not a UUID —
            `{"error":"missing_organization"}` (spec section 7).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /quotes/{id}/approve:
    post:
      operationId: approveQuote
      tags: [quotes]
      summary: Approve a quote version — releases the send job.
      description: |
        The analyst's central act (spec section 4 "Approval"):
        `Authenticate` + `ResolveTenant` +
        `RequireRole(OWNER, ADMIN, PRICING_ANALYST)` — the same user may
        prepare and approve. Inside one tenant transaction the handler
        row-locks the quote, refuses a `SUPERSEDED` version (409
        `quote_superseded`) and a negative-margin price (409
        `negative_margin`, audited as `quote.approve_refused`), stamps
        `approved_at`/`approved_by_user_id`/`approved_via='api'`, audits
        `quote.approved` and enqueues the S5 `quote_send` job — one commit.
        Re-approving an already-approved version is an idempotent no-op
        returning the stored approval; an unknown or other-tenant quote id
        gets the same uniform 404.
      security:
        - qpAccess: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quote version UUID (`app.quotes.id`).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: |
            The approved version's status and stored approval stamp —
            identical on a re-approve (the no-op returns what the first
            approval wrote).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveQuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/session:
    get:
      operationId: getSession
      tags: [web]
      summary: Current user and active organization.
      description: |
        The web app's session bootstrap: `Authenticate` verifies
        `qp_access`, then the handler answers the caller's profile plus
        every organization they belong to. The ACTIVE organization is
        resolved server-side — the `X-Organization-Id` header when an API
        client sends it, else the `qp_org` cookie POST
        /v1/session/organization sets, else the user's first membership
        (`list_memberships_for_email` ordered by created_at), so
        `organization` is always non-null. The route mounts Authenticate
        only: no org context is a fallback, not a 400.
      security:
        - qpAccess: []
      responses:
        '200':
          description: Session of the signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: |
            A malformed `X-Organization-Id` header —
            `{"error":"missing_organization"}` like ResolveTenant emits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/session/organization:
    post:
      operationId: switchOrganization
      tags: [web]
      summary: Make another of the user's organizations the active one.
      description: |
        Checks live membership (`get_membership` — a non-member and a
        nonexistent organization get the same byte-identical 404), then
        sets the `qp_org` cookie (HttpOnly, Secure, SameSite=Lax, Path=/):
        the tenant transport for browser clients that cannot send the
        custom header on every call. ResolveTenant reads it only as the
        fallback after the header — the cookie is transport, the
        per-request membership re-check stays the security boundary.
      security:
        - qpAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchOrganizationRequest'
      responses:
        '200':
          description: Session with the new active organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/inbox/quotes:
    get:
      operationId: listInboxQuotes
      tags: [web]
      summary: Quotes in the inbox of the active organization.
      description: |
        `Authenticate` + `ResolveTenant` — the tenant is the
        `X-Organization-Id` header when present, else the `qp_org` cookie
        (server behavior, not contract: the parameter stays optional so a
        cookie-only client still reaches the middleware). Every read runs
        inside `InTenantReadTx` under RLS.
      security:
        - qpAccess: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
        - name: status
          in: query
          required: false
          description: Only quotes in this status. Omit for all.
          schema:
            $ref: '#/components/schemas/InboxQuoteStatus'
        - name: q
          in: query
          required: false
          description: Case-insensitive match on RFQ number, customer name or subject.
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Inbox page with summary counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxQuotePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/quotes/{quoteId}:
    get:
      operationId: getQuoteDetail
      tags: [web]
      summary: Everything needed to audit one quote (split-screen audit).
      description: |
        `Authenticate` + `ResolveTenant`, same chain as /v1/inbox/quotes.
        `quoteId` is the RFQ's id (`app.rfq_requests.id` — the inbox item
        id, stable across quote versions), NOT a quote version id; the
        latest version rides along. An unknown or other-tenant id gets the
        same uniform 404 — RLS makes the row invisible.
      security:
        - qpAccess: []
      parameters:
        - name: quoteId
          in: path
          required: true
          description: RFQ UUID (`app.rfq_requests.id` — see operation description).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: Quote with the original email, agent extraction and price composition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/rfqs/{id}/reprocess:
    post:
      operationId: reprocessRfq
      tags: [rfqs]
      summary: Reprocess a parked RFQ — resume the pipeline at its earliest missing checkpoint.
      description: |
        `Authenticate` + `ResolveTenant` +
        `RequireRole(OWNER, ADMIN, PRICING_ANALYST)` — the review queue's
        release action (spec 2026-11-11 section 4 "Reprocess"). For an
        RFQ parked in `NEEDS_REVIEW` or `FAILED`, one tenant transaction
        row-locks the RFQ, clears `review_reason`/`failure_reason`,
        moves `status` back to the resumed stage's active status, writes
        the `rfq.reprocessed` audit row (actor, cleared reason, resumed
        stage) and enqueues the stage's job — one commit, nothing
        enqueued or written outside it.

        The resume point is the earliest missing checkpoint, so the paid
        extraction and a completed carrier fetch are never repeated:
        (0) both body columns NULL, zero `rfq_attachments` rows and no
        persisted extraction is the S1 dead-letter shell (permanent
        Resend fetch failure — an attachment-only ingest keeps its
        bodies NULL too, but always stores attachments) — `rfq_ingest`
        re-runs for the resolved `inbound_messages` receipt and promotes
        the shell in place, or `rfq_extract` when no receipt exists to
        resurrect; (1) a usable extraction — `extracted_payload_json` and
        `extraction_confidence` are the pair S2 commits together — else
        `rfq_extract` re-runs (`NO_USABLE_TEXT`, `INVALID_EXTRACTION`,
        `TARIFF_UPDATE` parks and dead-lettered `FAILED` shells land
        here); (2) a `DRAFT` quote — its existence proves the S3a
        checkpoint committed, so the time-dependent `request_hash`
        recompute never runs for a priced RFQ — with NULL
        `pdf_storage_key` means `rfq_render` re-runs (the RFQ is already
        `READY` past pricing), and a rendered `DRAFT` means `rfq_price`
        supersedes it into a new version; (3) only with no `DRAFT` does
        the S3a owed gate recompute off the stored extraction — FCL +
        derived IMPORT + `OwesImportFreight` — where no `carrier_offers`
        row for the recomputed `request_hash` means `rfq_fetch_rates`
        re-runs (any recorded outcome, even `NOT_APPLICABLE`/
        `FETCH_FAILED`, counts as completed), else `rfq_price`. The human
        reprocess IS the review-gate override: `LOW_CONFIDENCE`,
        `MISSING_TARIFF`, `REQUIRED_FIELD_MISSING` and the other
        business parks keep their persisted extraction and resume at
        pricing. Every other `app.rfq_status` — `RECEIVED`, `PARSING`,
        `PRICING`, `READY`, `APPROVED_SENT`, `IGNORED` — answers 409,
        except `READY` while its `DRAFT` quote awaits its first render
        (a dead-lettered `rfq_render` leaves exactly that shape);
        `IGNORED` is intentionally terminal.

        `REPROCESS_MIN_INTERVAL` (default 60s) bounds one reprocess per
        RFQ: a second call inside the interval answers 429 with
        `Retry-After` and enqueues nothing — a double click or retry
        loop cannot fan out jobs or carrier calls. The last reprocess
        time is read off the audit log, so no column is added. The 429
        applies only between parked reprocesses: while an accepted
        resume is still running, the RFQ sits in the resumed stage's
        active status (`RECEIVED`/`PARSING`/`PRICING`/`READY`) and a
        reprocess call answers 409 with that current status.
      security:
        - qpAccess: []
      parameters:
        - name: id
          in: path
          required: true
          description: RFQ UUID (`app.rfq_requests.id`).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '202':
          description: |
            Reprocess accepted — the resumed stage's job is already
            staged inside the committed transaction. `resumed_stage`
            names the River job kind the pipeline resumes at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessRfqResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `{"error":"rfq_not_parked","status":"<app.rfq_status>"}` —
            the RFQ is not in a reprocessable state (only
            `NEEDS_REVIEW`/`FAILED`, or `READY` with a `DRAFT` quote
            still awaiting its first render, are); `status` reports its
            current `app.rfq_status` value so the client can refresh
            its row — including the active status an accepted resume
            is still running under. A reprocess inside
            `REPROCESS_MIN_INTERVAL` of an accepted one answers 429,
            not 409 — even while the resumed render is in-flight,
            because the RFQ still reports the reprocessable READY +
            unrendered-DRAFT shape, so the rate-limit gate answers
            first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessConflict'
        '429':
          description: |
            `{"error":"rate_limited"}` — the newest `rfq.reprocessed`
            audit row for this RFQ is younger than
            `REPROCESS_MIN_INTERVAL`; nothing was written or enqueued.
            `Retry-After` carries the remaining wait in seconds.
          headers:
            Retry-After:
              description: Seconds until the next reprocess of this RFQ is accepted.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    qpAccess:
      type: apiKey
      in: cookie
      name: qp_access
      description: |
        15-minute HS256 access JWT — HttpOnly, Secure, SameSite=Lax,
        `Path=/` (spec section 4). Claims: `sub`, `sid`, `exp`, `iat`; never
        organization or role.
    qpRefresh:
      type: apiKey
      in: cookie
      name: qp_refresh
      description: |
        30-day opaque refresh token — HttpOnly, Secure, SameSite=Strict,
        `Path=/auth` — wide enough to reach `/auth/logout`, never sent to
        tenant routes; rotated on every exchange and the whole family
        is revoked on reuse (spec section 4).

  parameters:
    OrganizationIdHeader:
      name: X-Organization-Id
      in: header
      # Optional at the binding layer ON PURPOSE: ResolveTenant enforces
      # presence AFTER Authenticate runs, so an unauthenticated request gets
      # the uniform 401 even when the header is also absent — a required
      # wrapper binding would emit 400 first (spec section 7 ordering).
      required: false
      description: |
        Organization the request scopes to — required by the middleware, not
        the binding layer (an absent value reaches ResolveTenant as empty and
        gets the 400 {"error":"missing_organization"} only after
        authentication). Also part of the CSRF posture, since a cross-site
        form cannot set headers (ADR-005 section 4).
      schema:
        type: string
        description: |
          UUID of an organization the caller belongs to. Plain `string`, not
          `format: uuid` — handlers validate with `uuid.Parse` so the
          generated model stays free of `types.UUID`/`types.Email` wrapper
          types (the middleware emits the spec's uniform `missing_organization`
          400, not a binding error).

  schemas:
    ErrorCode:
      type: string
      description: |
        Machine-readable failure code. `unauthenticated`,
        `missing_organization`, `not_found`, `forbidden` and `internal` are
        the middleware contract of spec section 7; `bad_request` covers
        malformed bodies and `rate_limited` the login bucket (spec section
        8.1 leaves the code unpinned — this contract fixes it).
        `quote_superseded` and `negative_margin` are the two conflict
        refusals of quote approval (spec 2026-11-11 section 4);
        `rfq_not_parked` is the conflict refusal of RFQ reprocess — the
        RFQ is not in `NEEDS_REVIEW`/`FAILED` (its current status rides
        the 409 body alongside the code).
      enum:
        - bad_request
        - unauthenticated
        - missing_organization
        - not_found
        - forbidden
        - rate_limited
        - internal
        - quote_superseded
        - negative_margin
        - rfq_not_parked
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'

    MembershipRole:
      type: string
      description: Mirrors the `app.membership_role` enum (migration 0002).
      enum: [OWNER, ADMIN, PRICING_ANALYST]
    Membership:
      type: object
      additionalProperties: false
      required: [organization_id, name, slug, role]
      properties:
        organization_id:
          type: string
          description: Organization UUID (see `OrganizationIdHeader` for the plain-string choice).
        name:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/MembershipRole'
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, email, full_name]
      properties:
        id:
          type: string
          description: User UUID.
        email:
          type: string
          description: Lower-cased login email.
        full_name:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: |
            RFC 5322 addr-spec; matched case-insensitively
            (`find_user_by_email` and `get_user_auth_by_email` lower-case and
            trim). Plain `string` on purpose — see `OrganizationIdHeader` for
            the format/dependency trade-off.
        password:
          type: string
          description: |
            Present — even as the empty string — selects the password-login
            path (ADR-005 amendment 2026-11-16); absent selects the magic-link
            request. Deliberately no `minLength`: an empty password is just a
            wrong one and earns the same uniform 401. An explicit JSON `null`
            or a non-string value is malformed — 400, never a magic link.
          # x-go-type keeps the generated field as raw JSON so the handler
          # can tell "absent" apart from `null` — a typed *string collapses
          # both to nil and would treat an explicit null as a link request
          # (Devin Review). The pointer form *json.RawMessage collapses the
          # same way, hence x-go-type-skip-optional-pointer. The wire contract
          # is unchanged: still a string.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok` for a well-formed email — uniform by design.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: |
            RFC 5322 addr-spec, same normalization as `LoginRequest.email` —
            an unknown address answers the identical 200.
    PasswordSetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: |
            Base64url 32-byte token from the reset link — `SessionRequest`'s
            transport story verbatim: it crosses the wire once and the server
            stores only its SHA-256. Must come from a
            `purpose='password_reset'` row; a login token is the same 401 as
            a dead one.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            The new secret — the 8..128 policy is declared here and enforced
            by the endpoint (violations answer the uniform 400). Only its
            argon2id PHC ever reaches the store.
    SessionRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: |
            Base64url 32-byte token from the magic link (spec section 4). It
            crosses the wire once; the server stores only its SHA-256.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [profile, memberships]
      properties:
        profile:
          $ref: '#/components/schemas/UserProfile'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    MeResponse:
      type: object
      additionalProperties: false
      required: [id, email, full_name, memberships]
      properties:
        id:
          type: string
          description: User UUID.
        email:
          type: string
        full_name:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    QuoteStatus:
      type: string
      description: |
        Mirrors the `app.quote_status` enum (migration 0002). Approval
        leaves the version `DRAFT` — the send worker flips it to
        `APPROVED_SENT`; `SUPERSEDED` arrives only through recalculation.
      enum: [DRAFT, SUPERSEDED, APPROVED_SENT]
    ApproveQuoteResponse:
      type: object
      additionalProperties: false
      required: [id, status, approved_at, approved_by_user_id]
      properties:
        id:
          type: string
          description: Quote version UUID.
        status:
          $ref: '#/components/schemas/QuoteStatus'
        approved_at:
          type: string
          format: date-time
          description: Timestamp the first approval stamped.
        approved_by_user_id:
          type: string
          description: User UUID of the approving analyst.
    ReprocessStage:
      type: string
      description: |
        River job kind of the pipeline stage a reprocess resumed — the
        `resumed_stage` vocabulary of POST /v1/rfqs/{id}/reprocess.
      enum: [rfq_ingest, rfq_extract, rfq_fetch_rates, rfq_price, rfq_render]
    ReprocessRfqResponse:
      type: object
      additionalProperties: false
      required: [status, resumed_stage]
      properties:
        status:
          type: string
          enum: [accepted]
          description: |
            Always `accepted` — the stage job is staged inside the
            transaction, not completed (the pipeline runs async).
        resumed_stage:
          $ref: '#/components/schemas/ReprocessStage'
    ReprocessConflict:
      type: object
      additionalProperties: false
      required: [error, status]
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        status:
          type: string
          description: |
            The RFQ's current `app.rfq_status` — `RECEIVED`, `PARSING`,
            `PRICING`, `READY`, `APPROVED_SENT` or `IGNORED`
            (`NEEDS_REVIEW`/`FAILED` are reprocessable and never appear
            here). Plain string, not an enum: the vocabulary lives in
            the database, and a drifted value must reach the client
            verbatim instead of failing decode.
    OrganizationResponse:
      type: object
      additionalProperties: false
      required: [id, name, slug, inbound_email_alias, branding_json]
      properties:
        id:
          type: string
          description: Organization UUID.
        name:
          type: string
        slug:
          type: string
        inbound_email_alias:
          type: string
          description: |
            Resend Inbound alias — unique, lower-cased (migration 0002
            `CHECK (inbound_email_alias = lower(inbound_email_alias))`).
        branding_json:
          type: object
          description: |
            Free-form branding blob (colors, logo, legal footer) —
            `app.organizations.branding_json`, jsonb with `{}` default.

    # Third-party webhook payloads — schemas only, no paths (see the file
    # header). Shape follows Resend's documented `email.received` event
    # (https://resend.com/docs/webhooks/emails/received, checked
    # 2026-11-16): the webhook carries METADATA ONLY — body and headers come
    # from the Received emails API, attachment bytes from the Attachments
    # API whose download_url expires after one hour (RFC-002).
    # `additionalProperties: false` documents the contract for readers;
    # Go's encoding/json decodes tolerantly (Resend may add fields), so the
    # handler enforces only the keys it depends on.
    ResendEmailReceived:
      type: object
      additionalProperties: false
      required: [type, created_at, data]
      properties:
        type:
          type: string
          enum: [email.received]
          description: |
            Event discriminator — fixed `email.received` for this schema.
            The inbox handler rejects any other value with 400: a
            misconfigured Svix endpoint pointing other events at this route
            must fail fast, not be silently stored (2xx) or retried (5xx).
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the webhook event was created.
        data:
          $ref: '#/components/schemas/ResendEmailReceivedData'
    ResendEmailReceivedData:
      type: object
      additionalProperties: false
      required: [email_id, created_at, from, to, subject]
      properties:
        email_id:
          type: string
          description: |
            Resend's unique email identifier — maps to
            `app.inbound_messages.resend_message_id`, the idempotency key of
            the (organization_id, resend_message_id) unique constraint.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the email was received.
        message_id:
          type: string
          description: |
            RFC Message-ID header value — absent on events that fire before
            the email is sent; present on `email.received`.
        from:
          type: string
          description: |
            Sender's bare email address on received events; the display name
            is preserved in `headers.from` on the retrieve endpoint (RFC-002).
        to:
          type: array
          items:
            type: string
          description: |
            Recipient addresses — the tenant-resolution input: each entry is
            looked up through `resolve_inbound_org` and exactly one
            organization must match (ADR-005 section 7).
        cc:
          type: array
          items:
            type: string
          description: CC'd addresses (`[]` when none).
        bcc:
          type: array
          items:
            type: string
          description: BCC'd addresses (`[]` when none).
        received_for:
          type: array
          items:
            type: string
          description: |
            Addresses the email was forwarded for, taken from the `for`
            clause of the message's `Received` headers.
        subject:
          type: string
          description: Email subject line (`""` when the mail has none).
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ResendAttachment'
          description: |
            Attachment METADATA only — the bytes are fetched through the
            Attachments API (`download_url` expires after one hour, so the
            ingest job downloads immediately and never stores it, RFC-002).
        broadcast_id:
          type: string
          description: |
            Broadcast campaign id — applies to outbound events, not expected
            on `email.received`.
        template_id:
          type: string
          description: |
            Template id — applies to outbound events, not expected on
            `email.received`.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Tag key-value pairs associated with the email.
    ResendAttachment:
      type: object
      additionalProperties: false
      required: [id, filename, content_type]
      properties:
        id:
          type: string
          description: Attachment identifier accepted by the Attachments API.
        filename:
          type: string
          description: Original filename (e.g. `rfq.pdf`).
        content_type:
          type: string
          description: MIME type (e.g. `application/pdf`).
        content_disposition:
          type: string
          description: "`inline` or `attachment`."
        content_id:
          type: string
          description: |
            Content-ID of inline attachments referenced from the HTML body
            (e.g. `img001` for `<img src="cid:img001">`).

    # --- web v1 read surface (folded verbatim from web-api.yaml) -----------
    # Deltas vs the mock file, all agreed with Pedro:
    #   * the mock's QuoteStatus is renamed InboxQuoteStatus — core-api.yaml
    #     already uses QuoteStatus for the quote-version lifecycle enum
    #     (DRAFT/SUPERSEDED/APPROVED_SENT); the wire values are unchanged.
    #   * InboxQuote.route and InboxQuote.equipment are nullable: both stay
    #     null until the extraction agent fills them.
    #   * PriceComposition.fx is nullable: no FX applied is common.
    #   * The mock's own Error schema is NOT copied — these endpoints reuse
    #     this file's {"error": ...} shape like every core route.
    Session:
      type: object
      required: [user, organization, organizations]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        organization:
          description: Active organization; all organization-scoped endpoints answer for it.
          $ref: '#/components/schemas/SessionOrganization'
        organizations:
          type: array
          description: Every organization the user belongs to, including the active one.
          minItems: 1
          items:
            $ref: '#/components/schemas/SessionOrganization'
    SwitchOrganizationRequest:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
    SessionUser:
      type: object
      required: [id, name, email, role, organizationCount, language]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          readOnly: true
          description: Synced from the identity provider; not editable in web.
        role:
          type: string
          enum: [admin, operator]
        organizationCount:
          type: integer
          minimum: 1
        language:
          $ref: '#/components/schemas/UserLanguage'
    UserLanguage:
      type: string
      description: Language core-api uses for the texts it sends to this user.
      enum: [pt, en, es]
    SessionOrganization:
      type: object
      required: [id, name, planName, inboundAddress]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        planName:
          type: string
        inboundAddress:
          type: string
          format: email
          description: Address that receives RFQ emails for this organization.
    InboxQuoteStatus:
      type: string
      description: |
        The web-facing quote status (web-api.yaml's QuoteStatus, renamed —
        see the fold comment above): a coarser rollup of `app.rfq_status`
        for the inbox list.
      enum: [processing, awaiting_review, ready_to_send, sent]
    Equipment:
      type: string
      enum: [fcl_20dv, fcl_40hc, lcl, air]
    UnLocode:
      type: string
      pattern: "^[A-Z]{2}[A-Z2-9]{3}$"
      example: BRSSZ
    Route:
      type: object
      required: [origin, destination]
      properties:
        origin:
          $ref: '#/components/schemas/UnLocode'
        destination:
          $ref: '#/components/schemas/UnLocode'
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: "^-?\\d+(\\.\\d+)?$"
          description: Decimal amount as a string (no floats).
          example: "23260.55"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: BRL
    InboxQuote:
      type: object
      required:
        - id
        - rfqNumber
        - customerName
        - subject
        - route
        - equipment
        - status
        - estimatedTotal
        - confidencePercent
        - slaDueAt
        - slaAtRisk
        - receivedAt
      properties:
        id:
          type: string
          format: uuid
          description: The RFQ's id (`app.rfq_requests.id`), stable across quote versions.
        rfqNumber:
          type: integer
          minimum: 1
        customerName:
          type: string
        subject:
          type: string
        route:
          description: Null until the extraction agent resolves the lane.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Route'
        equipment:
          description: Null until the extraction agent resolves the modal.
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Equipment'
        status:
          $ref: '#/components/schemas/InboxQuoteStatus'
        estimatedTotal:
          description: Null while the quote is still processing.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
        confidencePercent:
          description: Deterministic extraction confidence (RFC-004). Null while processing.
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        slaDueAt:
          description: Deadline to answer the customer. Null once the quote is sent.
          type: string
          nullable: true
          format: date-time
        slaAtRisk:
          type: boolean
        receivedAt:
          type: string
          format: date-time
    InboxStatusCounts:
      type: object
      required: [all, processing, awaiting_review, ready_to_send, sent]
      properties:
        all:
          type: integer
          minimum: 0
        processing:
          type: integer
          minimum: 0
        awaiting_review:
          type: integer
          minimum: 0
        ready_to_send:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
    SlaRiskHighlight:
      type: object
      required: [customerName, slaDueAt]
      properties:
        customerName:
          type: string
        slaDueAt:
          type: string
          format: date-time
    InboxSummary:
      type: object
      required:
        - receivedToday
        - receivedYesterday
        - readyToSend
        - autoApproveConfidencePercent
        - avgResponseMinutes
        - responseTargetMinutes
        - slaAtRiskCount
        - mostUrgentSlaRisk
      properties:
        receivedToday:
          type: integer
          minimum: 0
        receivedYesterday:
          type: integer
          minimum: 0
        readyToSend:
          type: integer
          minimum: 0
        autoApproveConfidencePercent:
          type: integer
          minimum: 0
          maximum: 100
        avgResponseMinutes:
          type: integer
          minimum: 0
        responseTargetMinutes:
          type: integer
          minimum: 0
        slaAtRiskCount:
          type: integer
          minimum: 0
        mostUrgentSlaRisk:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SlaRiskHighlight'
    InboxQuotePage:
      type: object
      required: [items, summary, statusCounts, refreshedAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InboxQuote'
        summary:
          $ref: '#/components/schemas/InboxSummary'
        statusCounts:
          $ref: '#/components/schemas/InboxStatusCounts'
        refreshedAt:
          type: string
          format: date-time
    QuoteDetail:
      type: object
      required: [quote, email, extraction, pricing]
      properties:
        quote:
          $ref: '#/components/schemas/InboxQuote'
        email:
          $ref: '#/components/schemas/QuoteEmail'
        extraction:
          type: array
          description: Fields the agent extracted (or inferred) from the email.
          items:
            $ref: '#/components/schemas/ExtractedField'
        pricing:
          description: Null while the quote is still processing.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PriceComposition'
    QuoteEmail:
      type: object
      required: [from, to, receivedAt, paragraphs, attachments]
      properties:
        from:
          type: string
          format: email
        to:
          type: string
          format: email
        receivedAt:
          type: string
          format: date-time
        paragraphs:
          type: array
          description: Email body split into paragraphs of segments, so extracted spans can be highlighted.
          items:
            type: array
            items:
              $ref: '#/components/schemas/EmailSegment'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/EmailAttachment'
    EmailSegment:
      type: object
      required: [text, highlight]
      properties:
        text:
          type: string
        highlight:
          type: string
          enum: [none, extracted, inferred]
    EmailAttachment:
      type: object
      required: [fileName, sizeBytes]
      properties:
        fileName:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
    ExtractedField:
      type: object
      required: [label, value, inferred]
      properties:
        label:
          type: string
        value:
          type: string
        inferred:
          type: boolean
          description: True when the value was assumed, not read from the email.
    PriceComposition:
      type: object
      required:
        - sections
        - totalCost
        - marginPercent
        - margin
        - proposalTotal
        - confidencePercent
        - fx
        - validityHours
        - recalcFxThresholdPercent
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/PriceSection'
        totalCost:
          $ref: '#/components/schemas/Money'
        marginPercent:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Target margin as a decimal string (no floats).
        margin:
          $ref: '#/components/schemas/Money'
        proposalTotal:
          $ref: '#/components/schemas/Money'
        confidencePercent:
          type: integer
          minimum: 0
          maximum: 100
        fx:
          description: First applied FX rate; null when nothing was converted.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AppliedFxRate'
        validityHours:
          type: integer
          minimum: 1
        recalcFxThresholdPercent:
          $ref: '#/components/schemas/DecimalPercent'
    PriceSection:
      type: object
      required: [title, source, items, note]
      properties:
        title:
          type: string
        source:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PriceSource'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceItem'
        note:
          type: string
          nullable: true
    PriceSource:
      type: object
      required: [label, kind]
      properties:
        label:
          type: string
        kind:
          type: string
          enum: [private_rate, public_snapshot]
    PriceItem:
      type: object
      required: [label, detail, amount, inferred]
      properties:
        label:
          type: string
        detail:
          type: string
          nullable: true
        amount:
          $ref: '#/components/schemas/Money'
        inferred:
          type: boolean
    DecimalPercent:
      type: string
      pattern: "^\\d+(\\.\\d+)?$"
      description: Percentage as a decimal string (no floats), e.g. "12.0".
    AppliedFxRate:
      type: object
      required: [label, rate, referenceLabel, referenceRate]
      properties:
        label:
          type: string
          description: Rate used to price, e.g. "dólar armador".
        rate:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
        referenceLabel:
          type: string
          description: Reference rate shown for comparison, e.g. "PTAX".
        referenceRate:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"

  responses:
    BadRequest:
      description: Malformed request body — `{"error":"bad_request"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: |
        Uniform `{"error":"unauthenticated"}` — missing, forged, expired,
        reused or unknown credentials all share one byte-identical body
        (spec section 7).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        Byte-identical `{"error":"not_found"}` for non-member and
        nonexistent organization alike — the indistinguishability is the
        security property (spec section 7).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        `{"error":"forbidden"}` — the caller is a member but its role is
        outside the operation's allowed set (spec section 7).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        `{"error":"quote_superseded"}` or `{"error":"negative_margin"}` —
        the two business refusals of quote approval (spec 2026-11-11
        section 4): a retired version and a below-cost price are both hard
        blocks, machine-readable so the client can route each differently.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Login bucket exhausted — `{"error":"rate_limited"}` (spec section 8.1).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: '`{"error":"internal"}` — unclassified server failure.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
